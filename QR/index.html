<body>

<nav>
  <div class="nav-inner">
    <div class="logo"><a href="/index.html"><img src="https://kuzymuzy.ru/favicon.ico" alt="KuzyMuzy" class="logo-icon">KuzyMuzy</a></div>
    <div class="nav-links">
      <a href="/index.html">главная</a>
    </div>
    <a class="nav-cta" style="visibility:hidden;pointer-events:none;">useful_function()</a>
  </div>
</nav>

<main class="tool-page">
  <div class="tool-box">
    <div class="prompt-line"><span class="prompt">$</span> qr --generate</div>
    <h2>Генератор QR-кода</h2>
    <div id="qrcode1" style="display:none;"></div>
    <form id="QRform">
      <input id="QRtext" type="text" placeholder="Введите данные для QR" required class="input-group" style="border:1px solid var(--border);background:var(--bg);color:var(--text-primary);padding:10px 14px;border-radius:4px;font-family:var(--font-body);font-size:14px;width:100%;outline:none;">
      <button type="submit" class="btn btn--filled">Генерировать</button>
    </form>
    <button id="download" class="btn btn--outline" style="display:none;margin-top:12px;" onclick="QRdownload()">Скачать</button>
  </div>
</main>

<footer class="footer-bar">
  <p>© 2026 KuzyMuzy inc. Все права защищены.</p>
  <a href="/admin.html">Пароль от админки: 1234admin1234</a>
</footer>

    <script>
        let selectedVer = 1;
        const maxVer = 20;

        let qrcode1 = null;
        document.getElementById("QRform").addEventListener("submit", function (e) {
            e.preventDefault();
            GRgen();
        });

        function QRdownload() {
            const container = document.getElementById('qrcode1');
            const img = container.querySelector('img') || container.querySelector('canvas');

            const link = document.createElement("a");

            if (img.tagName === 'IMG') {
                link.href = img.src;
            } else if (img.tagName === 'CANVAS') {
                link.href = img.toDataURL("image/png");
            } else {
                return alert("Формат QR неизвестен.");
            }

            link.download = "QR-by-kuzymuzy.ru.png";
            link.click();
        }


        function QRdownloadOriginalOne() {
            const image = 'png'; 
            qrcode1.download('QR-by-kuzymuzy.ru.' + image, image);  
        }

        function GRgen(){
            selectedVer = 1
            document.getElementById('download').style.display=""
            document.getElementById('qrcode1').style.display="inline-block"
            document.getElementById('qrcode1').innerHTML = ""; 
            document.getElementById('qrcode1').append(content(qrcode1));
        }

        const content = (qrcodeInit) => {
            let QRtext = document.getElementById('QRtext').value;

            while (selectedVer <= maxVer) {
                try {
                    let qrcode = QRCreator(QRtext, {
                        eccl: 0,
                        version: selectedVer,
                        mask: 1,
                        image: 'PNG',
                        modsize: 9,
                        margin: 0
                    });

                    if (qrcode.error) {
                        throw new Error(qrcode.error);
                    }

                    return qrcode.result;
                } catch (err) {
                    if (err.message.includes("version") || err.message.includes("Версия")) {
                        selectedVer++;
                    } else {
                        return `Ошибка: ${err.message}`;
                    }
                }
            }

            return "Не удалось сгенерировать QR-код даже на максимальной версии 😢";
        };

    </script>

    <script>
        let userAgent = window.navigator.userAgent;

        if (userAgent.includes("AppleWebKit")) {
            const style = document.createElement('style');
            style.textContent = `
                select {
                    appearance: auto;
                    -webkit-appearance: none;
                }
            `;
            document.head.appendChild(style);
        }
    </script>

</body>
</html>
