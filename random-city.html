<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Генератор городов РФ</title>
    <link rel="stylesheet" href="/assets/css/random.css">
    <link rel="icon" href="https://kuzymuzy.ru/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Генератор городов России">
    <meta name="description" content="Генератор городов России">
    <meta name="keywords" content="Генератор, городо, город, рандомайзер">
    <meta property="og:title" content="Генератор городов России">
    <meta property="og:description" content="Генератор городов России">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Генератор городов России">
    <meta property="og:image" content="/assets/img/apple-touch-icon.png">
    <meta property="og:locale" content="ru_RU">
    <meta name="robots" content="index, follow">
    <script src="/assets/scripts/ukraine.js"></script>
</head>
<body>

    <nav>
      <div class="nav-inner">
        <div class="logo"><a href="index.html"><img src="https://kuzymuzy.ru/favicon.ico" alt="KuzyMuzy" class="logo-icon">KuzyMuzy</a></div>
        <div class="nav-links">
          <a href="index.html">главная</a>
          <a href="random.html">рандомайзер</a>
          <a href="random-answer.html">генератор ответов</a>
        </div>
        <a class="nav-cta" style="visibility:hidden;pointer-events:none;">useful_function()</a>
      </div>
    </nav>

    <main class="tool-page">
        <div class="tool-box">
            <div class="prompt-line"><span class="prompt">$</span> city --random</div>
            <h2>Генератор городов России</h2>
            <button id="generate-btn">Сгенерировать город</button>
            <div id="city-display" class="city-display"></div>
        </div>
    </main>

    <footer class="footer-bar">
        <p>© 2026 KuzyMuzy inc. Все права защищены.</p>
        <a href="admin.html">Пароль от админки: 1234admin1234</a>
    </footer>

    <script src="/assets/scripts/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var cities = [];

            function loadCities() {
                fetch('/assets/cities.txt')
                    .then(function(r) { return r.text(); })
                    .then(function(text) {
                        cities = text.split('\n').map(function(c) { return c.trim(); }).filter(function(c) { return c.length > 0; });
                    })
                    .catch(function(e) { console.error('Ошибка загрузки городов:', e); });
            }

            loadCities();

            document.getElementById('generate-btn').addEventListener('click', function() {
                if (cities.length === 0) {
                    document.getElementById('city-display').textContent = 'Города не загружены.';
                    return;
                }
                document.getElementById('city-display').textContent = cities[Math.floor(Math.random() * cities.length)];
            });
        });
    </script>
</body>
</html>
