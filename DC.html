<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Decision center</title>
    <link rel="stylesheet" href="/assets/css/random.css">
    <link rel="icon" href="https://kuzymuzy.ru/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Decision Center">
    <meta name="keywords" content="Decision, центр, решений">
    <meta property="og:title" content="Decision Center">
    <meta property="og:description" content="Decision Center">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Decision Center">
    <meta property="og:image" content="/assets/img/apple-touch-icon.png">
    <meta property="og:locale" content="ru_RU">
    <meta name="robots" content="index, follow">
    <script src="/assets/scripts/ukraine.js"></script>
</head>
<body>

    <nav>
      <div class="nav-inner">
        <div class="logo"><a href="index.html"><img src="https://kuzymuzy.ru/favicon.ico" alt="KuzyMuzy" class="logo-icon">KuzyMuzy</a></div>
        <div class="nav-links">
          <a href="index.html">главная</a>
          <a href="random.html">рандомайзер</a>
          <a href="random-answer.html">тест</a>
          <a href="random-city.html">города</a>
        </div>
        <a class="nav-cta" style="visibility:hidden;pointer-events:none;">useful_function()</a>
      </div>
    </nav>

    <main class="tool-page">
        <div class="tool-box">
            <div class="prompt-line"><span class="prompt">$</span> decision --pick</div>
            <h2>Decision Center</h2>
            <form id="random-form">
                <div class="input-group">
                    <label for="min">Минимальное значение</label>
                    <input type="number" value="1" id="min" required>
                </div>
                <div class="input-group">
                    <label for="max">Максимальное значение</label>
                    <input type="number" value="100" id="max" required>
                </div>
                <button type="submit" class="btn btn--filled">Сгенерировать</button>
            </form>
            <p id="result" class="result-text"></p>
            <p id="division2" class="result-text"></p>
            <p id="oddorevene" class="result-text"></p>
        </div>
    </main>

    <footer class="footer-bar">
        <p>© 2026 KuzyMuzy inc. Все права защищены.</p>
        <a href="admin.html">Пароль от админки: 1234admin1234</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('random-form');
            var result = document.getElementById('result');
            var division2 = document.getElementById('division2');
            var oddorevene = document.getElementById('oddorevene');

            if (!form) return;

            function oddEven(n) {
                return n % 2 === 0 ? 'Четное' : 'Нечетное';
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                var min = parseInt(document.getElementById('min').value, 10);
                var max = parseInt(document.getElementById('max').value, 10);

                if (min >= max) {
                    result.textContent = "Минимальное значение должно быть меньше максимального.";
                    division2.textContent = '';
                    oddorevene.textContent = '';
                    return;
                }

                var randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
                result.textContent = 'Случайное число: ' + randomNumber;
                division2.textContent = 'Деленное на два: ' + (randomNumber / 2);
                oddorevene.textContent = 'Четное / Нечетное: ' + oddEven(randomNumber);
            });
        });
    </script>
    <script src="/assets/scripts/scripts.js"></script>
</body>
</html>
