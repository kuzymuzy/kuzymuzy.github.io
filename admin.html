<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login into admin panel</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="/assets/scripts/ukraine.js"></script>
    <style>
        .input-wrap { position: relative; }
        #password { padding-right: 40px; }
    </style>
</head>
<body>

    <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
        <div class="admin-form">
            <h2>Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input value="admin" type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                        <button id="showpass" onclick="showpassword()" type="button" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-secondary);z-index:2;" aria-label="Показать пароль">🙉</button>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
                    <input type="checkbox" id="rememberme" name="rememberme" checked style="width:auto;">
                    <label for="rememberme" style="font-size:13px;color:var(--text-secondary);font-family:'IBM Plex Mono',monospace;">Remember me</label>
                </div>
                <button type="submit" class="btn btn--filled" style="width:100%;">Login</button>
            </form>
            <div style="text-align:center;margin-top:16px;">
                <a href="/" style="font-size:13px;">&larr; Back to kuzymuzy.ru</a>
            </div>
            <div id="login-message" style="margin-top:16px;text-align:center;font-size:13px;"></div>
        </div>
    </main>

    <script src="/assets/scripts/admin.js"></script>
</body>
</html>
