<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Генератор ответов на тест</title>
    <link rel="stylesheet" href="/assets/css/random.css">
    <link rel="icon" href="https://kuzymuzy.ru/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Генератор ответов на тест">
    <meta name="keywords" content="Генератор, ответов, тест, рандомайзер">
    <meta property="og:title" content="Генератор ответов на тест">
    <meta property="og:description" content="Генератор ответов на тест">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Генератор ответов на тест">
    <meta property="og:image" content="/assets/img/apple-touch-icon.png">
    <meta property="og:locale" content="ru_RU">
    <meta name="robots" content="index, follow">
    <script src="/assets/scripts/ukraine.js"></script>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <div class="logo">
                <img src="favicon.ico" alt="KuzyMuzy" class="logo-icon">
                KUZYMUZY
            </div>
            <div class="nav-links">
                <a href="index.html">главная</a>
                <a href="random.html">рандомайзер</a>
                <a href="random-city.html">города</a>
                <a href="DC.html">decision</a>
            </div>
            <button class="theme-btn" id="themeToggle" aria-label="Переключить тему">🌙</button>
        </div>
    </nav>

    <main class="tool-page">
        <div class="tool-box">
            <div class="prompt-line"><span class="prompt">$</span> test --generate</div>
            <h2>Генератор ответов на тест</h2>
            <div class="input-group">
                <label for="letter-count">Количество ответов</label>
                <input type="number" value="10" id="letter-count" placeholder="Количество ответов" min="1" max="1000">
            </div>
            <div class="input-group">
                <label for="range-start">Минимальная буква</label>
                <input type="text" value="А" placeholder="Минимальная буква" id="range-start">
            </div>
            <div class="input-group">
                <label for="range-end">Максимальная буква</label>
                <input type="text" value="Г" placeholder="Максимальная буква" id="range-end">
            </div>
            <button id="generate-btn">Сгенерировать</button>
            <h2 id="answers" style="display:none;margin-top:24px;font-size:16px;">Ответы:</h2>
            <div id="result" class="result-text" style="margin-top:12px;"></div>
        </div>
    </main>

    <footer class="footer-bar">
        <p>© 2026 KuzyMuzy inc. Все права защищены.</p>
        <a href="admin.html">Пароль от адмники: 1234admin1234</a>
    </footer>

    <script src="/assets/scripts/scripts.js"></script>
    <script>
        (function() {
            var btn = document.getElementById('generate-btn');
            if (!btn) return;
            btn.addEventListener('click', function() {
                var letterCount = parseInt(document.getElementById('letter-count').value, 10);
                var rangeStart = document.getElementById('range-start').value;
                var rangeEnd = document.getElementById('range-end').value;

                if (rangeStart.length !== 1 || rangeEnd.length !== 1) {
                    alert('Диапазон должен содержать только один символ!');
                    return;
                }

                var startCode = rangeStart.charCodeAt(0);
                var endCode = rangeEnd.charCodeAt(0);

                var russianRanges = [[0x0410, 0x042F], [0x0430, 0x044F]];

                if (!russianRanges.some(function(r) { return startCode >= r[0] && startCode <= r[1]; }) ||
                    !russianRanges.some(function(r) { return endCode >= r[0] && endCode <= r[1]; })) {
                    alert('Диапазон должен включать русские буквы!');
                    return;
                }

                if (startCode > endCode) {
                    alert('Начало диапазона должно быть меньше или равно концу!');
                    return;
                }

                var result = '';
                for (var i = 0; i < letterCount; i++) {
                    var randomCode = Math.floor(Math.random() * (endCode - startCode + 1)) + startCode;
                    if (russianRanges.some(function(r) { return randomCode >= r[0] && randomCode <= r[1]; })) {
                        result += String.fromCharCode(randomCode) + ') ';
                    } else {
                        result += '?) ';
                    }
                }

                document.getElementById('result').textContent = result.trim();
                document.getElementById('answers').style.display = 'block';
            });
        })();
    </script>
</body>
</html>
