    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Рандомайзер цифр">
    <meta name="keywords" content="Генератор, цифр, цифры, рандомайзер">
    <meta property="og:title" content="Рандомайзер">
    <meta property="og:description" content="Рандомайзер">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Рандомайзер">

    <meta property="og:locale" content="ru_RU">
    <meta name="robots" content="index, follow">

</head>
<body>

    <nav>
        <div class="nav-inner">
            <div class="logo">
                <img src="favicon.ico" alt="KuzyMuzy" class="logo-icon">
                KUZYMUZY
            </div>
            <div class="nav-links">
                <a href="index.html">главная</a>
                <a href="random-answer.html">тест</a>
                <a href="random-city.html">города</a>
                <a href="DC.html">decision</a>
            </div>
            <button class="theme-btn" id="themeToggle" aria-label="Переключить тему">🌙</button>
        </div>
    </nav>

    <main class="tool-page">
        <div class="tool-box">
            <div class="prompt-line"><span class="prompt">$</span> random --range</div>
            <h2>Генератор случайных чисел</h2>
            <form id="random-form">
                <div class="input-group">
                    <label for="min">Минимальное значение</label>
                    <input type="number" value="1" id="min" required>
                </div>
                <div class="input-group">
                    <label for="max">Максимальное значение</label>
                    <input type="number" value="100" id="max" required>
                </div>
                <button type="submit" class="btn btn--filled">Сгенерировать</button>
            </form>
            <p id="result" class="result-text"></p>
        </div>
    </main>

    <footer class="footer-bar">
        <p>© 2026 KuzyMuzy inc. Все права защищены.</p>
        <a href="admin.html">Пароль от адмники: 1234admin1234</a>
    </footer>

    <script src="/assets/scripts/random.js"></script>
